; Default multiplayer configuration, staged next to the binary by CMake so a
; SOURCE build matches the shipped release artifact. Without this file
; RegistrationDefaultAddr() (SDL2Dialogs.cpp) falls back to "" and the Join
; Network Game dialog opens with an EMPTY server address.
;
; The game REWRITES this file at runtime (the join flow persists whatever the
; player types), so it is staged only when absent - a rebuild must not reset a
; player's saved server.
[vdmplay]
RegistrationServerAddr=54.219.190.35

[TCP]
WellKnownPort=2346
ServerAddress=54.219.190.35
RegistrationAddress=54.219.190.35
